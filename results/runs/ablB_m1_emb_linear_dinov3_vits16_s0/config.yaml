data_root: data_cache/reaching_v1
features_root: results/features
backbone: dinov3_vits16
feature_key: cls
train_split: train
train_fraction: 1.0
val_split: val
latent_dim: 64
action_dim: 2
embedding_seed: 0
projector: linear
net:
  hidden_dim: 256
  num_layers: 3
  mlp_ratio: 4.0
optim:
  lr: 0.01
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  batch_size: 256
  steps: 6000
  warmup_steps: 200
  grad_clip: 1.0
  schedule: cosine
eval_every: 250
log_grad_cosine_every: 250
select_on: val_action_mse
seed: 0
device: cuda
out_root: results
run_name: ablB_m1_emb_linear_dinov3_vits16_s0
model:
  kind: m1
  n_steps: 8
  lambda_fm: 1.0
  lambda_action: 1.0
  lambda_emb: 1.0
  lambda_cf: 0.0
  cf_times:
  - 1.0
  pairing: paired
